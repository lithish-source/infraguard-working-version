services:
  # ---------------- Backend Web Service ----------------
  - type: web
    name: infraguard-backend
    runtime: python
    rootDir: backend
    buildCommand: bash .render-build.sh
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        value: sqlite:///./infraguard.db
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: UPLOAD_DIR
        value: /tmp/uploads
      - key: DEFAULT_ADMIN_EMAIL
        value: admin@infraguard.gov
      - key: DEFAULT_ADMIN_PASSWORD
        value: Admin@12345
      - key: DEFAULT_ADMIN_NAME
        value: System Administrator
      - key: PYTHON_VERSION
        value: 3.11.9

  # ---------------- Frontend Static Site ----------------
  - type: web
    name: infraguard-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: infraguard-backend
          property: host
        value: https://${infraguard-backend.host}/api/v1
